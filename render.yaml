services:
  - type: web
    name: gstin-bulk-validator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GSTIN_API_KEY
        sync: false   # You set this manually in Render dashboard
